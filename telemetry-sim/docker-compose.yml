services:
  simulator:
    build: .
    container_name: telemetry_simulator
    environment:
      # Point this at your Raspberry Pi's IP on your local network
      - MQTT_BROKER_IP=192.168.1.84 
      - MQTT_PORT=1883
      # Updated to match the new file generated by the export script
      - DATASET_PATH=/app/data/simulation_test_data.csv
    volumes:
      # Mount the current folder (including the newly generated /data folder) 
      # directly into the container
      - .:/app